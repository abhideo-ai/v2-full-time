<section>
  <h2>Applications</h2>
  <!-- Six tabs over eleven statuses, which is v1's tab set exactly. The mapping
       and the reasoning behind it live in automation/jobs_db.py (TAB_FOR_STATUS)
       and automation/README.md. There is deliberately no "all", and no
       "archived" either: this list comes from jobs_tracker_v2, which holds v2's
       seats and only v2's seats — v1's 92 rows are in another database. Counts
       are filled from the rows by static/tabs.js — never written here. -->
  <div class="app-controls">
    <div class="status-tabs" role="tablist" aria-label="Filter applications by status">
      <button class="status-tab active" type="button" data-tab="ready" role="tab" aria-selected="true">Ready to apply <span class="tab-count">0</span></button>
      <button class="status-tab" type="button" data-tab="applied" role="tab" aria-selected="false">Applied <span class="tab-count">0</span></button>
      <button class="status-tab" type="button" data-tab="closed" role="tab" aria-selected="false">No longer available <span class="tab-count">0</span></button>
      <button class="status-tab" type="button" data-tab="heard-back" role="tab" aria-selected="false">Heard back <span class="tab-count">0</span></button>
      <button class="status-tab" type="button" data-tab="not-selected" role="tab" aria-selected="false">Not selected <span class="tab-count">0</span></button>
      <button class="status-tab" type="button" data-tab="other" role="tab" aria-selected="false">Other <span class="tab-count">0</span></button>
    </div>
    <input id="app-search" class="app-search" type="search"
           placeholder="Search company or role…" aria-label="Search company or role"
           autocomplete="off" />
  </div>
  <!-- Rows are rendered from the jobs_tracker database by static/apps.js.
       Never hand-write a row here: the database is the search layer, and a row
       added by hand is a row no query can see. Register it with
       automation/jobs_sync.py instead — resume.py new already does. -->
  <p id="app-status" class="app-status">Loading applications…</p>
  <div id="app-list"></div>
  <p id="tab-empty" class="app-empty" hidden>No applications match.</p>
</section>

</main>
<script src="static/tabs.js" defer></script>
<script src="static/apps.js" defer></script>
